[project]
name = "nelke"
dynamic = ["version"]
description = "Nelke - self-improving general-purpose agent (research, math, programming)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "openai>=1.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "beautifulsoup4>=4.12",
    "markdownify>=0.13",
    "duckduckgo-search>=6.0",
    "sympy>=1.12",
    "numpy>=1.26",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.1",
    "jinja2>=3.1.6",
    "itsdangerous>=2.2.0",
    "sse-starlette>=3.4.8",
    "textual>=8.2.8",
    "aiogram>=3.30.0",
    "aiohttp-socks>=0.11.0",
]

[project.scripts]
nelke = "nelke.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/nelke/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/nelke"]

[tool.hatch.build.targets.wheel.force-include]
"templates" = "nelke/templates"
"static" = "nelke/static"

# SPA build: the wheel ships whatever has been pre-built under static/dist.
# Run `npm run build` in web-ui/ before building a release wheel (the Vite
# config emits to ../static/dist). A reference hatch build hook lives at
# src/nelke/_hatch_build.py; it can be enabled by packaging it as a separate
# plugin and registering under [tool.hatch.build.hooks.<name>] when needed.

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: tests that hit a real LLM endpoint (set NELKE_TEST_REAL=1 to run)",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
no_implicit_optional = true
check_untyped_defs = true
show_error_codes = true
warn_unused_ignores = false
