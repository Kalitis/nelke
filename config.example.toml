# Nelke provider profiles. Copy to ~/.nelke/config.toml and edit.

# Samling temperature for agent/tool/subagent/reviewer calls. Keep 0 (default)
# so OpenAI-compatible providers' automatic prompt caching engages: a non-zero
# temperature disables prompt caching and can make long agent loops ~10x more
# expensive. Raise it only if a provider bills the same either way.
# NELKE_AGENT_TEMPERATURE=0.0

[profiles.openai]
base_url = "https://api.openai.com/v1"
model = "gpt-4o-mini"
api_key_ref = "OPENAI_API_KEY"

[profiles.openrouter]
base_url = "https://openrouter.ai/api/v1"
model = "openai/gpt-4o-mini"
api_key_ref = "OPENROUTER_API_KEY"

[profiles.lmstudio]
base_url = "http://localhost:1234/v1"
model = "qwen2.5-coder-7b-instruct"
api_key = "lm-studio"
# Local providers bypass OS env proxies by default. If you NEED a proxy for a
# remote provider, add: extra = { trust_env = true }

[profiles.ollama]
base_url = "http://localhost:11434/v1"
model = "qwen3:8b"
api_key = "ollama"