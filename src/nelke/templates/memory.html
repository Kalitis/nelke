{% extends "base.html" %}
{% block title %}Nelke — Memory{% endblock %}
{% block content %}
<section class="memory">
  <h1>Memory</h1>
  {% if files %}
  <ul class="memory-list">
    {% for f in files %}
      <li><span class="name">{{ f.name }}</span> <span class="size">{{ f.size }} B</span></li>
    {% endfor %}
  </ul>
  {% else %}
  <p class="empty">No memory files yet.</p>
  {% endif %}
</section>
{% endblock %}
