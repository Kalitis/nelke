# Nelke provider profiles. Copy to ~/.nelke/config.toml and edit.

[profiles.openai]
base_url = "https://api.openai.com/v1"
model = "gpt-4o-mini"
api_key_ref = "OPENAI_API_KEY"

[profiles.openrouter]
base_url = "https://openrouter.ai/api/v1"
