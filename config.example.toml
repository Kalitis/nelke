# Nelke provider profiles. Copy to ~/.nelke/config.toml and edit.

# Sampling temperature for agent/tool/subagent/reviewer calls. Defaults to 1
# (the OpenAI-compatible standard). Prompt caching is NOT gated by temperature
# on the dslab profile — identical long prefixes hit the cache at T=1.0 and
# T=0.0 alike (verified 2026-08-11). Lower it per-profile only for more
# deterministic sampling.
# NELKE_AGENT_TEMPERATURE=1.0

[profiles.openai]
base_url = "https://api.openai.com/v1"
model = "gpt-4o-mini"
api_key_ref = "OPENAI_API_KEY"

[profiles.openrouter]
base_url = "https://openrouter.ai/api/v1"
model = "openai/gpt-4o-mini"
api_key_ref = "OPENROUTER_API_KEY"

[profiles.lmstudio]
base_url = "http://localhost:1234/v1"
model = "qwen2.5-coder-7b-instruct"
api_key = "lm-studio"
# Local providers bypass OS env proxies by default. If you NEED a proxy for a
# remote provider, add: extra = { trust_env = true }

[profiles.ollama]
base_url = "http://localhost:11434/v1"
model = "qwen3:8b"
api_key = "ollama"

# Embeddings for semantic memory recall / auto-link (optional).
#
# When present and reachable, Nelke uses real dense embeddings here instead of
# the built-in offline hashing — LM Studio is a great fit because it can serve
# strong multilingual embedding models (BGE, E5, GTE, Jina, ...) locally.
#
# `model` is optional: leave it empty to auto-detect whichever embedding model
# is currently loaded in LM Studio (scanning /v1/models for embedding-family
# model ids). If the endpoint is down or no embedding model is loaded, Nelke
# silently falls back to the offline embedder. Set NELKE_EMBEDDINGS_ENABLED=false
# to disable real embeddings entirely.
[embeddings]
base_url = "http://localhost:1234/v1"
api_key = "lm-studio"
# model = "bge-m3"
# timeout = 10.0